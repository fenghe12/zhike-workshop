# Replace the old location /api/ { return 404; } in the existing HTTPS site.
# Retain the current certificate, host, application routes and artifact authorization.
location /api/ {
    proxy_pass http://127.0.0.1:18772;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 660s;
    proxy_request_buffering off;
    proxy_buffering off;
}
