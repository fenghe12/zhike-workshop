[project]
name = "wan-ai-wan2-2-s2v-14b-bridge"
version = "0.1.0"
description = "Complete pretrained backbone latent adaptation for Wan-AI/Wan2.2-S2V-14B"
requires-python = ">=3.11,<3.12"
dependencies = ["diffusers==0.35.2", "transformers==4.53.1", "accelerate==1.12.0", "safetensors==0.4.5", "numpy==1.26.4", "einops", "Pillow", "omegaconf", "ftfy", "sentencepiece", "torchvision==0.22.1", "torchaudio==2.7.1", "easydict"]

[project.optional-dependencies]
ascend = ["torch==2.7.1", "torch-npu==2.7.1"]
cuda = ["torch==2.7.1"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
package = false
conflicts = [[{extra = "ascend"}, {extra = "cuda"}]]

[tool.ascendbridge]
compatibility-profile = "Existing persistent npu-base: Python3.11, torch2.7.1+cpu, torch_npu2.7.1, CANN8.3rc1, Ascend910B2"
execution-environment = "/home/ma-user/work/npu-migration/envs/npu-base"
